name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # toda segunda: o SCA acha vulnerabilidades novas mesmo sem PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    name: Lint e testes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (Ruff)
        run: ruff check .
      - name: Testes (pytest + cobertura)
        # Ainda sem --cov-fail-under: rode uma vez, anote o percentual e só então trave o valor.
        run: pytest -q --cov=app --cov-report=term-missing

  testes-postgres:
    name: Testes com PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: acheiaqui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teste -d acheiaqui_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Banco descartável que só existe durante este job. Não é o Supabase.
      DATABASE_URL: postgresql://teste:teste@localhost:5432/acheiaqui_test
      TEST_DATABASE_URL: postgresql://teste:teste@localhost:5432/acheiaqui_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Aplicar as migrações no banco de teste
        run: python scripts/aplicar_migracoes.py --usar-variavel-de-ambiente --sim
      - name: Aplicar de novo (a segunda vez precisa dizer que já está em dia)
        run: |
          python scripts/aplicar_migracoes.py --usar-variavel-de-ambiente --sim | tee /tmp/segunda-execucao.txt
          grep -q "Nada a aplicar" /tmp/segunda-execucao.txt
      - name: Testes (pytest contra PostgreSQL de verdade)
        run: pytest -q

  sast:
    name: SAST (Bandit e Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit semgrep
      - name: Bandit (só severidade média ou alta)
        run: bandit -r backend/app -ll
      - name: Semgrep (backend e frontend)
        run: semgrep scan --config p/python --config p/javascript --config p/owasp-top-ten --metrics=off --error backend/app frontend

  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r backend/requirements.txt

  segredos:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
