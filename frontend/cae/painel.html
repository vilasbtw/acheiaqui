<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel da CAE — Achei Aqui</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header><strong>Achei Aqui · CAE</strong><span id="campus-cae"></span><a href="../index.html" id="site-publico">Site público</a><a href="#" id="sair">Sair</a></header>
  <main>
    <h1>Itens registrados</h1>
    <form id="form-filtros">
      <label for="status">Status</label>
      <select id="status"><option value="">Todos</option><option value="disponivel">Disponíveis</option><option value="devolvido">Devolvidos</option></select>
      <label for="data_inicio">Encontrados a partir de</label>
      <input id="data_inicio" type="date">
      <label for="data_fim">Encontrados até</label>
      <input id="data_fim" type="date">
      <button type="submit">Filtrar</button>
    </form>
    <div id="mensagem"></div>
    <div id="resultados"></div>
    <button id="mais" type="button" hidden>Ver mais</button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/painel.js"></script>
</body>
</html>
